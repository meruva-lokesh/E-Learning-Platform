server.port=8080

# ---- Database (override with env vars in real deployments) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Lokesh@2910}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT (access token is short-lived, refresh token lives in an HttpOnly cookie) ----
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.access-expiration-ms=${JWT_ACCESS_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:7}

# ---- Web security ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:4200}
app.cookie.secure=${COOKIE_SECURE:false}


app.admin.email=${ADMIN_EMAIL:admin@elearning.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.username=${ADMIN_USERNAME:Administrator}
app.admin.mobile=${ADMIN_MOBILE:9999999999}
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}


# ---- Rate limiting (per client IP, per minute) ----
ratelimit.global.per-minute=${RL_GLOBAL_PER_MIN:120}
ratelimit.auth.per-minute=${RL_AUTH_PER_MIN:10}
ratelimit.login.max-failures=${RL_LOGIN_MAX_FAILURES:5}
ratelimit.login.lock-minutes=${RL_LOGIN_LOCK_MIN:15}

# ---- Gemini AI (leave the key empty to use the lexical fallback) ----
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6JlwJxKLX9KGRr9Txz1reCMZ7OGU6ehBW_H2q_d6HbKdQ}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
gemini.generation.model=${GEMINI_GENERATION_MODEL:gemini-2.5-flash}
course.ai.similarity-threshold=0.55

# ---- AI usage limits ----
ai.limit.per-minute=${AI_LIMIT_PER_MIN:6}
ai.limit.per-day=${AI_LIMIT_PER_DAY:60}
ai.max-query-length=200
ai.daily-embedding-budget=${AI_DAILY_EMBEDDING_BUDGET:2000}

# ---- Logging ----
# DEBUG for our own code in development (the prod profile sets INFO); trace messages need TRACE.
logging.level.com.examly.springapp=DEBUG
logging.pattern.level=%5p [%X{requestId:-}]

# ---- Swagger / OpenAPI (http://localhost:8080/swagger-ui.html) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
