<div class="confirm">
  <mat-icon class="confirm-icon" [class.danger]="data.danger" *ngIf="data.icon">{{ data.icon }}</mat-icon>
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>{{ data.message }}</mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button id="confirmCancel" *ngIf="!data.hideCancel" [mat-dialog-close]="false">{{ data.cancelText || 'Cancel' }}</button>
    <button mat-flat-button id="confirmYes" [color]="data.danger ? 'warn' : 'primary'" [mat-dialog-close]="true" cdkFocusInitial>{{ data.confirmText || 'OK' }}</button>
  </mat-dialog-actions>
</div>
